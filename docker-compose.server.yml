name: xiaobai-writer

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
      - -c
      - effective_cache_size=192MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-novel_role}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    cpus: "0.35"
    mem_limit: 384m
    mem_reservation: 128m
    memswap_limit: 384m
    pids_limit: 128
    oom_score_adj: 600
    shm_size: 64m
    logging: *bounded-logging
    stop_grace_period: 30s
    restart: unless-stopped

  migrate:
    image: ${XIAOBAI_IMAGE:-ghcr.io/980567039/xiaobai-writer}:migrator-latest
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-novel_role}?schema=public
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      db:
        condition: service_healthy
    cpus: "0.50"
    mem_limit: 384m
    mem_reservation: 128m
    memswap_limit: 384m
    pids_limit: 128
    oom_score_adj: 900
    logging: *bounded-logging
    restart: "no"

  web:
    image: ${XIAOBAI_IMAGE:-ghcr.io/980567039/xiaobai-writer}:latest
    pull_policy: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-novel_role}?schema=public
      AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:-}
      AI_PROVIDER: ${AI_PROVIDER:-openai-compatible}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_PLANNING_MODEL: ${AI_PLANNING_MODEL:-}
      AI_WRITING_MODEL: ${AI_WRITING_MODEL:-}
      AI_CHECK_MODEL: ${AI_CHECK_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      IMAGE_API_KEY: ${IMAGE_API_KEY:-}
      IMAGE_BASE_URL: ${IMAGE_BASE_URL:-https://codex.quat.cc/v1}
      IMAGE_MODEL: ${IMAGE_MODEL:-gpt-image-2}
      IMAGE_SIZE: ${IMAGE_SIZE:-1024x1024}
      IMAGE_STORAGE_DIR: /app/data/image-assets
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_OPTIONS: --max-old-space-size=512
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-3001}:3000"
    volumes:
      - image_assets:/app/data/image-assets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    cpus: "0.75"
    mem_limit: 768m
    mem_reservation: 256m
    memswap_limit: 768m
    pids_limit: 256
    oom_score_adj: 800
    logging: *bounded-logging
    stop_grace_period: 20s
    init: true
    restart: unless-stopped

volumes:
  postgres_data:
  image_assets:
