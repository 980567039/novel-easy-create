name: Export deployment images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  export:
    name: Package private GHCR images
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull matching application images
        run: |
          docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xiaobai-writer:latest
          docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xiaobai-writer:migrator-latest

      - name: Create a server-loadable image archive
        run: |
          docker save \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xiaobai-writer:latest \
            ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xiaobai-writer:migrator-latest \
            | gzip -1 > xiaobai-writer-images.tar.gz

      - name: Upload short-lived deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaobai-writer-images
          path: xiaobai-writer-images.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
